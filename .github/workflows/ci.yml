name: CI

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ── 1. 타입 체크 ───────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (server)
        run: pnpm --filter @stride/server exec tsc --noEmit

      - name: Typecheck (mobile)
        run: pnpm --filter @stride/mobile exec tsc --noEmit

      - name: Report failure
        if: failure()
        run: echo "::error::[FAIL] 타입 에러 수정 후 재시도. 로컬: pnpm --filter @stride/server exec tsc --noEmit"

  # ── 2. 린트 (계층 의존성 룰 포함) ──────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint (no-layer-violation + all rules)
        run: pnpm exec eslint "apps/**/*.{ts,tsx}" "packages/**/*.ts" --max-warnings 0

      - name: Report failure
        if: failure()
        run: echo "::error::[FAIL] ESLint 에러 수정. 에러 메시지의 '수정:' 지시에 따라 의존성 방향을 역전시키거나 금지 패턴을 제거하라"

  # ── 3. 테스트 + 커버리지 ────────────────────────────────────────────────────
  test:
    name: Test (coverage ≥ 60%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Jest + coverage ≥ 60%
        run: |
          pnpm --filter @stride/server exec jest \
            --coverage \
            --coverageThreshold='{"global":{"lines":60,"functions":60,"branches":60,"statements":60}}'

      - name: Report failure
        if: failure()
        run: echo "::error::[FAIL] 테스트 커버리지 60% 미달. 실패한 테스트를 먼저 수정하고, 미커버 코드에 테스트를 추가하라"

  # ── 4. 서버 기동 시간 (800ms 이내) ─────────────────────────────────────────
  server-start:
    name: Server start < 800ms
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/stride-ci
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-not-for-production
      PORT: 3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm --filter @stride/server build

      - name: Start server and verify boot < 800ms
        run: |
          node apps/server/dist/main.js &
          SERVER_PID=$!

          START_MS=$(date +%s%3N)
          READY=false

          for i in $(seq 1 8); do
            sleep 0.1
            if curl -sf --max-time 0.8 http://localhost:3000/health > /dev/null 2>&1 || \
               curl -sf --max-time 0.8 http://localhost:3000 > /dev/null 2>&1; then
              READY=true
              break
            fi
          done

          END_MS=$(date +%s%3N)
          ELAPSED=$((END_MS - START_MS))
          kill $SERVER_PID 2>/dev/null || true

          if [ "$READY" != "true" ]; then
            echo "::error::[FAIL] 서버가 800ms 이내에 응답하지 않았습니다 (${ELAPSED}ms 경과)"
            exit 1
          fi
          echo "서버 기동 시간: ${ELAPSED}ms ✓"

      - name: Report failure
        if: failure()
        run: echo "::error::[FAIL] 서버 기동 800ms 초과. AppModule 초기화 병목 또는 MongoDB 연결 지연 확인"

  # ── 5. 기술 부채 드리프트 감지 ─────────────────────────────────────────────
  drift-check:
    name: Drift check (no-issue creation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run drift scanner
        run: bash scripts/drift-scan.sh

      - name: Report failure
        if: failure()
        run: |
          echo "::error::[FAIL] 기술 부채 패턴 발견. 위 목록의 파일을 수정하라:"
          echo "::error::  process.env → configService.get()"
          echo "::error::  AsyncStorage → expo-secure-store"
          echo "::error::  [lat, lng] → [lng, lat]"
          echo "::error::  console.log → 제거 또는 Logger 사용"
